version: "3.9"

# ── OSINT Surface Analyzer — Sin dominio / Sin Traefik ────────────────────────
# Acceso directo por IP:puerto. No requiere dominio ni certificado SSL.
#
# Uso:
#   docker compose -f docker-compose.no-domain.yml up -d --build
#
# Acceso:
#   http://localhost:8080          (mismo servidor)
#   http://IP_DEL_SERVIDOR:8080    (red local o internet si el puerto está abierto)
#
# ⚠️  Sin HTTPS — usar solo en red local de confianza o detrás de VPN.
#     Para acceso remoto seguro, usar Cloudflare Tunnel (docker-compose.cf-tunnel.yml)

services:

  # ── Puppeteer (interno) ───────────────────────────────────────────────────
  osint-puppeteer:
    build:
      context: ./puppeteer
      dockerfile: Dockerfile
    image: osint-puppeteer:v1
    container_name: osint-puppeteer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_ADMIN
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    networks:
      - osint-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ── CLI Tools (interno) ───────────────────────────────────────────────────
  osint-tools:
    build:
      context: ./osint-tools
      dockerfile: Dockerfile
    image: osint-tools:v1
    container_name: osint-tools
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - osint-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ── Backend + Frontend ────────────────────────────────────────────────────
  osint-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: osint-surface-analyzer:latest
    container_name: osint-analyzer
    ports:
      - "8080:8080"        # ← puerto expuesto directamente (sin Traefik)
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PUPPETEER_SERVICE_URL=http://osint-puppeteer:3000
      - TOOLS_SERVICE_URL=http://osint-tools:4000
      - OSINT_DEPLOY_SECRET=${OSINT_DEPLOY_SECRET:-osint-default-changeme}
    depends_on:
      osint-puppeteer:
        condition: service_healthy
      osint-tools:
        condition: service_healthy
    volumes:
      - osint-results:/app/results
      - osint-scans:/app/data/scans
      - osint-evidence:/app/data/evidence
      - osint-keys:/app/data/keys
    networks:
      - osint-internal   # solo red interna — sin traefik-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  osint-results:
  osint-scans:
  osint-evidence:
  osint-keys:

networks:
  osint-internal:
    driver: bridge
